services:
  db:
    container_name: postgres_life_hub
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - life_hub_backend
  redis:
    container_name: redis_life_hub
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepas ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - life_hub_backend
volumes:
  postgres_data:
  redis_data:

networks:
  life_hub_backend: